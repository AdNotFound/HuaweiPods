name: Sync README to LSPosed

on:
  push:
    branches: [main]
    paths:
      - README.md
      - README_EN.md
      - .github/workflows/sync-readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update LSPosed README
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPOSITORY: Xposed-Modules-Repo/moe.chenxy.huaweipods
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$TARGET_REPOSITORY" target-repository -- --depth=1
          cp README.md README_EN.md target-repository/
          git -C target-repository config user.name "github-actions[bot]"
          git -C target-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target-repository add README.md README_EN.md
          if git -C target-repository diff --cached --quiet; then
            echo "LSPosed README is already up to date."
            exit 0
          fi
          git -C target-repository commit -m "docs: sync HuaweiPods README"
          git -C target-repository push origin HEAD:main
